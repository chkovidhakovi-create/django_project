<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Induction Motor Fault Detection</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef5ff, #dbeafe);
        color: #1f2937;
    }

    /* Navigation */
    nav {
        width: 100%;
        padding: 18px 7%;
        background: #0f172a;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .logo {
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        gap: 28px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        transition: 0.3s;
    }

    nav a:hover {
        color: #60a5fa;
    }

    /* Main */
    .main {
        min-height: calc(100vh - 70px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
    }

    /* Login Card */
    .container {
        width: 100%;
        max-width: 430px;
        background: rgba(255, 255, 255, 0.98);
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);
    }

    .icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    h1 {
        text-align: center;
        font-size: 30px;
        color: #111827;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }

    /* Error */
    .error {
        background: #fee2e2;
        color: #dc2626;
        padding: 12px;
        border-radius: 7px;
        text-align: center;
        margin-bottom: 20px;
        font-size: 14px;
    }

    /* Form */
    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
        font-size: 15px;
        font-weight: bold;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
        background: #f8fafc;
    }

    input:focus {
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Button */
    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    /* Register */
    .register {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #64748b;
    }

    .register a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }

    .register a:hover {
        text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {

        nav {
            flex-direction: column;
            gap: 15px;
            padding: 16px 5%;
        }

        .logo {
            font-size: 18px;
            text-align: center;
        }

        .nav-links {
            gap: 20px;
        }

        nav a {
            font-size: 14px;
        }

        .main {
            padding: 35px 18px;
        }

        .container {
            padding: 32px 25px;
        }
    }

    @media (max-width: 400px) {

        .nav-links {
            gap: 13px;
        }

        nav a {
            font-size: 13px;
        }

        .container {
            padding: 28px 20px;
        }

        h1 {
            font-size: 26px;
        }

    }

</style>
```

</head>

<body>

```
<!-- Navigation -->
<nav>

    <div class="logo">
        ⚙ Motor Fault Detection
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/login/">Login</a>

        <a href="/register/">Register</a>

    </div>

</nav>


<!-- Login Section -->
<div class="main">

    <div class="container">

        <div class="icon">
            ⚙️
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to access the Induction Motor Fault Detection System
        </p>


        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>
                User Name
            </label>

            <input
                type="text"
                name="user_name"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                🔐 Login
            </button>

        </form>


        <p class="register">

            Don't have an account?

            <a href="/register/">
                Register Now
            </a>

        </p>

    </div>

</div>
```

</body>

</html>
